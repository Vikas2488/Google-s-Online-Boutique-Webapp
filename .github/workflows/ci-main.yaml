name: Continuous Integration

on:
  push:
    branches:
      - main

jobs:
  code-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Run your unit tests here"

  deployment-tests:
    runs-on: ubuntu-24.04
    needs: code-tests

    permissions:
      contents: read

    env:
      AWS_REGION: ap-south-1
      CLUSTER_NAME: vikas-cluster
      NAMESPACE: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin

      - name: Create Namespace
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ECR Repositories
        run: |
          REPOS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for repo in "${REPOS[@]}"; do
            echo "Checking online-boutique/$repo"

            aws ecr describe-repositories \
              --repository-names online-boutique/$repo \
              --region $AWS_REGION >/dev/null 2>&1

            if [ $? -ne 0 ]; then
              echo "Creating online-boutique/$repo"

              aws ecr create-repository \
                --repository-name online-boutique/$repo \
                --region $AWS_REGION
            else
              echo "Repository already exists."
            fi
          done

      - name: Build and Deploy
        run: |
          skaffold config set --global local-cluster false

          skaffold run \
            --default-repo=${{ steps.login-ecr.outputs.registry }}/online-boutique \
            --tag=${{ github.sha }} \
            --namespace=$NAMESPACE

      - name: Wait For Pods
        run: |
          kubectl wait deployment \
            --all \
            --for=condition=Available \
            --timeout=600s \
            -n $NAMESPACE

      - name: Verify Deployment
        run: |
          echo "Pods:"
          kubectl get pods -n $NAMESPACE

          echo ""
          echo "Services:"
          kubectl get svc -n $NAMESPACE

          echo ""
          echo "Ingress:"
          kubectl get ingress -n $NAMESPACE || true
